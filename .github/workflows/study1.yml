name: study1

# Study 1 (type I error and power of xi_n's tests with discrete margins).
#   * push to branch brm-revision  -> SMOKE run (R = 20 per cell), checks the pipeline only
#   * push a tag named study1-v*   -> FULL run (publication-size R), 13 parallel shards
# Each shard runs simulation/scripts/20_study1.R with a fixed seed and uploads its CSV as an
# artifact (study1-<block>-<shard>). Download them with:  gh run download <run-id>
on:
  push:
    branches: [brm-revision]
    paths:
      - 'simulation/scripts/20_study1.R'
      - 'simulation/R/study1_lib.R'
      - 'simulation/R/dgp.R'
      - 'simulation/R/calibration.R'
      - '.github/workflows/study1.yml'
    tags: ['study1-v*']

jobs:
  study1:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MODE: ${{ startsWith(github.ref, 'refs/tags/study1-') && 'full' || 'smoke' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {block: typeI_asym, shard: '50'}
          - {block: typeI_asym, shard: '100'}
          - {block: typeI_asym, shard: '250'}
          - {block: typeI_asym, shard: '500'}
          - {block: typeI_asym, shard: '1000'}
          - {block: typeI_perm, shard: '100'}
          - {block: typeI_perm, shard: '250'}
          - {block: typeI_perm, shard: '500'}
          - {block: power_asym, shard: 'lineal'}
          - {block: power_asym, shard: 'cuadratica'}
          - {block: power_asym, shard: 'senoidal'}
          - {block: power_perm, shard: '100'}
          - {block: power_perm, shard: '250'}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install XICOR
        run: Rscript -e 'install.packages("XICOR")'
      - name: Run shard
        working-directory: simulation
        env:
          STUDY1_OUT: ${{ github.workspace }}/out
        run: |
          if [ "$MODE" = "smoke" ]; then export STUDY1_SMOKE=1; fi
          Rscript scripts/20_study1.R ${{ matrix.block }} ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: study1-${{ env.MODE }}-${{ matrix.block }}-${{ matrix.shard }}
          path: out/
          if-no-files-found: error
